services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: beslenme_kocu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dietcoach123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-dietcoach123}@db:5432/beslenme_kocu
      ADMIN_IDS: ${ADMIN_IDS}
      PAYMENT_URL: ${PAYMENT_URL:-http://localhost:5000/odeme}

  payment:
    build: .
    restart: always
    command: python3 -m src.payment_server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-dietcoach123}@db:5432/beslenme_kocu
      PAYMENT_URL: ${PAYMENT_URL:-http://localhost:5000/odeme}

volumes:
  pgdata:
