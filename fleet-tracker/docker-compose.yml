services:
  fleet-tracker:
    build: .
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fleet-tracker.rule=Host(`fleet.tyrian-global.com`)"
      - "traefik.http.routers.fleet-tracker.entrypoints=websecure"
      - "traefik.http.routers.fleet-tracker.tls.certresolver=letsencrypt"
      - "traefik.http.services.fleet-tracker.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
