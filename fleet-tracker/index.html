<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Fleet Tracker — Pangea</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
background: #060b15;
color: #e0e8f0;
height: 100%;
width: 100%;
overflow: hidden;
    }
#app {
display: flex;
flex-direction: column;
height: 100dvh;
width: 100%;
    }
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 20px;
height: 58px;
background: linear-gradient(90deg, #07111f 0%, #0d1f38 60%, #0a1a2e 100%);
border-bottom: 1px solid #1a3050;
z-index: 1000;
flex-shrink: 0;
gap: 12px;
    }
.brand {
display: flex;
align-items: center;
gap: 11px;
flex-shrink: 0;
    }
.brand-logo {
width: 34px;
height: 34px;
flex-shrink: 0;
    }
.brand-text h1 {
font-size: 1.1rem;
font-weight: 800;
letter-spacing: 3px;
color: #7ec8e3;
text-transform: uppercase;
line-height: 1.1;
white-space: nowrap;
    }
.brand-text .sub {
font-size: 0.6rem;
color: #3d6a8a;
letter-spacing: 1.5px;
text-transform: uppercase;
margin-top: 1px;
    }
.fleet-stats {
display: flex;
gap: 8px;
    }
.stat-pill {
display: flex;
flex-direction: column;
align-items: center;
background: rgba(20,40,70,0.55);
border: 1px solid #1a3050;
border-radius: 8px;
padding: 5px 14px;
min-width: 56px;
    }
.stat-pill .num {
font-size: 1.15rem;
font-weight: 700;
color: #7ec8e3;
line-height: 1.1;
    }
.stat-pill .lbl {
font-size: 0.55rem;
color: #3d6a8a;
letter-spacing: 1px;
text-transform: uppercase;
    }
#map {
flex: 1;
min-height: 0;
width: 100%;
    }
.leaflet-control-zoom a {
background: #0d1b2e !important;
color: #7ec8e3 !important;
border-color: #1a3050 !important;
    }
.leaflet-control-zoom a:hover {
background: #1a3050 !important;
    }
.legend {
background: rgba(7,17,31,0.93) !important;
border: 1px solid #1a3050 !important;
border-radius: 10px;
padding: 11px 15px;
backdrop-filter: blur(10px);
    }
.legend h3 {
font-size: 0.6rem;
letter-spacing: 2px;
color: #3d6a8a;
text-transform: uppercase;
margin-bottom: 9px;
    }
.legend-item {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 6px;
font-size: 0.78rem;
color: #b0c8dc;
white-space: nowrap;
    }
.legend-item:last-child { margin-bottom: 0; }
.ld {
width: 11px;
height: 11px;
border-radius: 50%;
flex-shrink: 0;
    }
.ld.u { background: #3b9eff; box-shadow: 0 0 6px #3b9eff88; }
.ld.p { background: #2ecc71; box-shadow: 0 0 6px #2ecc7188; }
.ld.a { background: #f39c12; box-shadow: 0 0 6px #f39c1288; }
.ts-ctrl {
background: rgba(7,17,31,0.93) !important;
border: 1px solid #1a3050 !important;
border-radius: 8px;
padding: 6px 12px;
font-size: 0.68rem;
color: #3d6a8a;
text-align: right;
backdrop-filter: blur(10px);
line-height: 1.5;
    }
.ts-ctrl strong { color: #5a9abd; display: block; font-size: 0.7rem; }
.leaflet-popup-content-wrapper {
background: #07111f !important;
border: 1px solid #1a3050 !important;
border-radius: 14px !important;
box-shadow: 0 12px 40px rgba(0,0,0,0.7) !important;
padding: 0 !important;
    }
.leaflet-popup-tip-container { display: none; }
.leaflet-popup-content { margin: 0 !important; }
.pu {
width: 300px;
padding: 16px 18px 14px;
    }
.pu-head {
display: flex;
align-items: flex-start;
justify-content: space-between;
gap: 8px;
margin-bottom: 11px;
    }
.pu-name {
font-size: 0.95rem;
font-weight: 700;
color: #7ec8e3;
letter-spacing: 0.5px;
line-height: 1.2;
    }
.pu-badge {
font-size: 0.6rem;
font-weight: 700;
letter-spacing: 1px;
text-transform: uppercase;
padding: 3px 9px;
border-radius: 20px;
flex-shrink: 0;
margin-top: 2px;
    }
.pu-badge.u { background: rgba(59,158,255,0.15); color: #3b9eff; border: 1px solid #3b9eff44; }
.pu-badge.p { background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid #2ecc7144; }
.pu-badge.a { background: rgba(243,156,18,0.15); color: #f39c12; border: 1px solid #f39c1244; }
.pu-div {
border: none;
border-top: 1px solid #1a3050;
margin: 0 0 10px;
    }
.pu-row {
display: flex;
gap: 8px;
margin-bottom: 5px;
font-size: 0.78rem;
    }
.pu-lbl {
color: #3d6a8a;
min-width: 62px;
flex-shrink: 0;
font-size: 0.67rem;
text-transform: uppercase;
letter-spacing: 0.5px;
padding-top: 1px;
    }
.pu-val {
color: #bdd0e0;
line-height: 1.4;
    }
.pu-notes {
background: rgba(20,40,70,0.4);
border-left: 2px solid #1a3050;
border-radius: 0 6px 6px 0;
padding: 7px 10px;
font-size: 0.72rem;
color: #7a9ab5;
margin-top: 8px;
line-height: 1.5;
    }
@media (max-width: 600px) {
#topbar { padding: 0 12px; height: 54px; }
.brand-text h1 { font-size: 0.9rem; letter-spacing: 2px; }
.brand-text .sub { display: none; }
.stat-pill { padding: 4px 9px; min-width: 44px; }
.stat-pill .num { font-size: 0.95rem; }
.fleet-stats { gap: 5px; }
.pu { width: 260px; padding: 13px 14px 11px; }
.pu-name { font-size: 0.85rem; }
.leaflet-popup { min-width: 0 !important; }
.legend { padding: 9px 12px; }
.legend-item { font-size: 0.72rem; }
    }
@media (max-width: 380px) {
.fleet-stats { display: none; }
    }
</style>
</head>
<body>
<div id="app">
<div id="topbar">
<div class="brand">
<svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="40" height="40" rx="9" fill="#0d1f38"/>
<circle cx="20" cy="20" r="13" stroke="#1a3050" stroke-width="1.2"/>
<ellipse cx="20" cy="20" rx="6" ry="13" stroke="#1a3050" stroke-width="1"/>
<line x1="7" y1="20" x2="33" y2="20" stroke="#1a3050" stroke-width="1"/>
<polygon points="20,9 26,23 20,20 14,23" fill="#7ec8e3" opacity="0.9"/>
<rect x="15" y="23" width="10" height="3" rx="1.5" fill="#3b9eff" opacity="0.7"/>
<path d="M11 28 Q15 26 20 28 Q25 30 29 28" stroke="#7ec8e3" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
<div class="brand-text">
<h1>Fleet Tracker</h1>
<div class="sub">Pangea · Tyrian · Nimara</div>
</div>
</div>
<div class="fleet-stats">
<div class="stat-pill">
<span class="num">5</span>
<span class="lbl">Vessels</span>
</div>
<div class="stat-pill">
<span class="num">2</span>
<span class="lbl">Underway</span>
</div>
<div class="stat-pill">
<span class="num">2</span>
<span class="lbl">At Port</span>
</div>
<div class="stat-pill">
<span class="num">1</span>
<span class="lbl">Anchor</span>
</div>
</div>
</div>
<div id="map"></div>
</div>
<script>
/* ═══════════════════════════════════════════════════
   VESSEL DATA — updated by Claude Cowork agent daily
═══════════════════════════════════════════════════ */
const vessels = [
  {
    vessel: "MV ALYCIA",
    status: "at port",
    current_position: "Paramaribo, Suriname",
    from_port: "Bata, Equatorial Guinea",
    to_port: "TBD",
    eta: "Arrived",
    etd: "25 Mar 2026 21:00",
    cargo: "Bulk cargo — deşarj tamamlandı",
    notes: "Deşarj 24 Mar 08:00'de tamamlandı. ETD 25 Mar 21:00 (tayfa değişimi sebebiyle gecikti). Charter ref: UBCSV02.",
    lat: 5.83,
    lon: -55.17
  },
  {
    vessel: "MV THOR FUTURE",
    status: "underway",
    current_position: "Seyir halinde → Hongay, Vietnam",
    from_port: "Son liman",
    to_port: "Hongay → Panama → Port au Prince",
    eta: "ETA Hongay: 29 Mar 2026",
    etd: "ETD Hongay: 06 Apr 2026",
    cargo: "47.100 MT bulk (yüklenecek)",
    notes: "Tam rota: Hongay (ETA 29-Mar) → Panama Kanalı (ETA 15-May) → Port au Prince (ETA 20-May). Stowplan: 47.100 MT.",
    lat: 18.5,
    lon: 109.0
  },
  {
    vessel: "MV C HUNNA",
    status: "at anchor",
    current_position: "Port au Prince, Haiti — demirde bekliyor",
    from_port: "Son liman",
    to_port: "Port au Prince, Haiti (Berth 6 — deşarj)",
    eta: "Arrived (19 Mar 2026'dan beri)",
    etd: "ETD: 07 Apr 2026 (AM)",
    cargo: "Bulk cargo — deşarj bekliyor",
    notes: "Rıhtımda yer yok (MV LIVADI + MV ABK TIGER). ETB: 26 Mar AM. ETC/ETD: 07 Apr AM. Charter: Tyrian Global (UBCSV26-2).",
    lat: 18.55,
    lon: -72.34
  },
  {
    vessel: "MV AGIOS FANOURIOS",
    status: "at port",
    current_position: "St. Louis du Sud, Haiti",
    from_port: "Son liman",
    to_port: "St. Louis du Sud (deşarj)",
    eta: "Arrived",
    etd: "ETD: 25 Mar 2026 (bugün)",
    cargo: "Bulk cargo — deşarj aşamasında",
    notes: "Rıhtımda yanaşık. ETD bugün. Charter: Tyrian Global (UBCSV01). Laytime hesaplamaları devam ediyor.",
    lat: 18.27,
    lon: -73.98
  },
  {
    vessel: "MV ALEA",
    status: "underway",
    current_position: "Seyir halinde → Algeciras, İspanya",
    from_port: "Yükleme limanı",
    to_port: "Algeciras (yakıt) → St. Louis du Sud, Haiti",
    eta: "ETA Algeciras: 25 Mar (gecikmeli) / ETA St. Louis: 09 Apr",
    etd: "ETD St. Louis: 23 Apr 2026",
    cargo: "Bulk cargo — kargo yüklü",
    notes: "Algeciras'ta bunkering. Kötü hava + liman yoğunluğu nedeniyle gecikme. Signed OBL'ler 23 Mar'da ajansa iletildi. Charter: Tyrian Global.",
    lat: 36.13,
    lon: -5.45
  }
];

const routes = [
  {
    points: [
      [18.5,  109.0],
      [20.97, 107.07],
      [22.0,  125.0],
      [15.0,  145.0],
      [5.0,   180.0],
      [2.0,   205.0],
      [5.0,   230.0],
      [9.0,   281.0],
      [18.55, 287.66],
    ],
    color: "#3b9eff"
  },
  {
    points: [
      [36.13, -5.45],
      [28.5,  -14.0],
      [15.0,  -30.0],
      [10.5,  -55.0],
      [14.0,  -65.0],
      [18.27, -73.98],
    ],
    color: "#3b9eff"
  }
];

const STATUS = {
  "underway":  { color: "#3b9eff", cls: "u", label: "Underway"  },
  "at port":   { color: "#2ecc71", cls: "p", label: "At Port"   },
  "at anchor": { color: "#f39c12", cls: "a", label: "At Anchor" }
};

const WORLD_BOUNDS = L.latLngBounds(
  L.latLng(-85, -200),
  L.latLng(85,   200)
);
const map = L.map('map', {
  center:             [18, 0],
  zoom:               3,
  minZoom:            2,
  maxZoom:            14,
  maxBounds:          WORLD_BOUNDS,
  maxBoundsViscosity: 1.0,
  worldCopyJump:      false,
  zoomControl:        true
});
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; <a href="https://www.openstreetmap.org/">OSM</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains:  'abcd',
    maxZoom:     19,
    noWrap:      true
  }
).addTo(map);

routes.forEach(r => {
  L.polyline(r.points, {
    color:     r.color,
    weight:    2,
    opacity:   0.5,
    dashArray: '7 7'
  }).addTo(map);
  for (let i = 0; i < r.points.length - 1; i++) {
    const p1 = r.points[i];
    const p2 = r.points[i + 1];
    const dx = p2[1] - p1[1];
    const dy = p2[0] - p1[0];
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) continue;
    const mid  = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
    const angle = Math.atan2(dx, dy) * (180 / Math.PI);
    L.marker(mid, {
      icon: L.divIcon({
        html: `<div style="width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:8px solid ${r.color};opacity:0.75;transform:rotate(${angle}deg);transform-origin:center center;"></div>`,
        className:  '',
        iconSize:   [8, 8],
        iconAnchor: [4, 4]
      }),
      interactive: false
    }).addTo(map);
  }
});

function shipSVG(color) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <defs>
      <radialGradient id="glow_${color.replace('#','')}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </radialGradient>
      <filter id="f_${color.replace('#','')}">
        <feGaussianBlur stdDeviation="1.8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="20" cy="20" r="19" fill="url(#glow_${color.replace('#','')})"/>
    <circle cx="20" cy="20" r="13" fill="${color}" opacity="0.12" stroke="${color}" stroke-width="0.5" stroke-opacity="0.4"/>
    <g filter="url(#f_${color.replace('#','')})">
      <polygon points="20,6 29,27 20,23 11,27" fill="${color}" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
    </g>
    <circle cx="20" cy="20" r="2.5" fill="white" opacity="0.85"/>
  </svg>`;
}

vessels.forEach(v => {
  const s = STATUS[v.status] || STATUS["underway"];
  const icon = L.divIcon({
    html:       `<div style="cursor:pointer;transition:transform .15s" title="${v.vessel}">${shipSVG(s.color)}</div>`,
    className:  '',
    iconSize:   [40, 40],
    iconAnchor: [20, 20],
    popupAnchor:[0, -22]
  });
  const popup = `
    <div class="pu">
      <div class="pu-head">
        <div class="pu-name">${v.vessel}</div>
        <span class="pu-badge ${s.cls}">${s.label}</span>
      </div>
      <hr class="pu-div"/>
      <div class="pu-row"><span class="pu-lbl">Konum</span><span class="pu-val">${v.current_position}</span></div>
      <div class="pu-row"><span class="pu-lbl">Varış</span><span class="pu-val">${v.to_port}</span></div>
      <div class="pu-row"><span class="pu-lbl">ETA</span><span class="pu-val">${v.eta}</span></div>
      <div class="pu-row"><span class="pu-lbl">ETD</span><span class="pu-val">${v.etd}</span></div>
      <div class="pu-row"><span class="pu-lbl">Kargo</span><span class="pu-val">${v.cargo}</span></div>
      <div class="pu-notes">${v.notes}</div>
    </div>`;
  L.marker([v.lat, v.lon], { icon })
    .addTo(map)
    .bindPopup(popup, { maxWidth: 310, className: '' });
});

const legendCtrl = L.control({ position: 'bottomleft' });
legendCtrl.onAdd = function() {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `
    <h3>Durum</h3>
    <div class="legend-item"><div class="ld u"></div>Seyir Halinde</div>
    <div class="legend-item"><div class="ld p"></div>Limanda</div>
    <div class="legend-item"><div class="ld a"></div>Demirde</div>`;
  return d;
};
legendCtrl.addTo(map);

const tsCtrl = L.control({ position: 'bottomright' });
tsCtrl.onAdd = function() {
  const d = L.DomUtil.create('div', 'ts-ctrl');
  d.innerHTML = `Son güncelleme<strong>25 Mart 2026 — 02:35 TR</strong>`;
  return d;
};
tsCtrl.addTo(map);

window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
</html>
