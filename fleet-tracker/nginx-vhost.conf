# VPS'teki nginx'e eklenecek vhost config
# Dosyayı şuraya koy: /etc/nginx/sites-available/fleet-tracker
# Sonra: sudo ln -s /etc/nginx/sites-available/fleet-tracker /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d fleet.tyrian-global.com

server {
    listen 80;
    server_name fleet.tyrian-global.com;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
